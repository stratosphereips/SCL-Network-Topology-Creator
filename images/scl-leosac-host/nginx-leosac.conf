# nginx front door for the Leosac Ember web UI (static SPA; it talks to the
# core over its own WebSocket, ws://<host>:8888/websocket, baked into the
# bundle and rewritten at boot by leosac-app-start.sh).
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/leosac;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
