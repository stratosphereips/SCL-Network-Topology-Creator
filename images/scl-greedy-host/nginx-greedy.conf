# nginx front door for the "Greedy Cars" (integrador) full-stack target.
# Reverse-proxies the three Spring Boot apps' context paths so the whole app is
# reachable same-origin on :80 from any host in the topology (no CORS). The
# apps already mount at /greedy_cars, /greedy_institucional, /gredy_cars_client
# (SERVER_SERVLET_CONTEXT_PATH), so we pass the original URI through unchanged.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    # Root → the client app (the user-facing UI).
    location = / {
        return 302 /gredy_cars_client/;
    }

    # greedy_cars API (:9000, context /greedy_cars)
    location /greedy_cars/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # institucional site (:8080, context /greedy_institucional)
    location /greedy_institucional/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # client app (:8081, context /gredy_cars_client)
    location /gredy_cars_client/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

