# nginx front door for the ERPNext host.
# Reverse-proxies :80 -> the Frappe gunicorn web server on :8000, so the whole
# ERPNext app (login at /login, REST at /api/method/..., desk) is reachable
# same-origin on :80 from any host in the topology. Large client bodies allowed
# for file uploads (ERPNext File/Attachment doctype).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 128m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Frappe realtime (socketio) — proxy ws upgrades to the node server on :9000.
    location /socket.io {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host erpnext.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> gunicorn.
    # Frappe resolves the site purely from the Host header (site = Host, no
    # wildcard), so force Host to the single site name regardless of how the
    # client addressed us (IP / 127.0.0.1 / hostname) — otherwise Frappe 404s
    # with "<host> does not exist".
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host erpnext.localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
