# Same secret scanning as the SLIPS fork (detect-secrets v1.5.0 + baseline).
# Intentional lab credentials (weak on purpose for the attackers) live in
# .secrets.baseline; anything new is flagged. Activate once per clone:
#   pre-commit install
repos:
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
        - id: detect-secrets
          args: ['--baseline', '.secrets.baseline']
          exclude: '.*\.md$'

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
        - id: trailing-whitespace
        - id: end-of-file-fixer
        - id: check-added-large-files
        - id: check-merge-conflict
        - id: detect-private-key
