# Detector variants: the ONLY difference between strong/middle/weak peers is
# which SLIPS modules are disabled. Names follow SLIPS matching (lowercase,
# '_'/'-'/' ' stripped, substring of the module path), so 'brute_force'
# disables brute_force_detector. render_configs.py rejects names that match
# no module, and any name that would disable the federated module.
default: strong

variants:
  strong:
    - template
    - exporting_alerts
    - blocking
    - leak_detector
    - cyst
    - arp_poisoner
  # Strength gradient (Oct 14, measured on the bal1 sweep): conn_analyzer is the
  # only module whose conn-flow labels no other module duplicates (every
  # ml_*/http/brute_force/network_discovery label is also cited by it), and
  # arp is the only source of ARP labels. Estimated label recall vs GT, conn /
  # ARP: strong 0.99 / 0.995, middle ~0.79 / 0.995 (ML detectors still label
  # conn flows), weak ~0.62 / 0.995 (only ml_online left for conn).
  middle:
    - template
    - exporting_alerts
    - blocking
    - leak_detector
    - cyst
    - brute_force
    - anomaly_detection
    - conn_analyzer
    - arp_poisoner
  weak:
    - template
    - exporting_alerts
    - blocking
    - leak_detector
    - cyst
    - brute_force
    - anomaly_detection
    - conn_analyzer
    - network_discovery
    - ml_linear
    - arp_poisoner
